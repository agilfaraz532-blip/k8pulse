# K8sPulse demo workload: a small "shop" app with realistic, intentional failure modes.
#
#   kubectl apply -f demo/shop-demo.yaml      # deploy
#   kubectl delete namespace demo             # remove everything
#
# Healthy services: storefront (nginx), catalog-api, redis cache, order-worker (emits logs)
# Built-in incidents for K8sPulse to detect and the AI copilot to diagnose:
#   - payment-service  -> CrashLoopBackOff (required config missing, exits on startup)
#   - inventory-sync   -> OOMKilled (memory grows past its 48Mi limit)
#   - report-generator -> steady CPU load (shows up in the CPU charts)
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    app.kubernetes.io/part-of: shop-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-html
  namespace: demo
data:
  index.html: |
    <!doctype html><html><head><title>Shop Demo</title></head>
    <body style="font-family:sans-serif;background:#0b1120;color:#e2e8f0;display:grid;place-items:center;height:100vh">
    <div><h1>Shop Demo</h1><p>Storefront served by nginx, monitored by K8sPulse.</p></div></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: demo
  labels: { app: storefront, app.kubernetes.io/part-of: shop-demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: storefront } }
  template:
    metadata: { labels: { app: storefront, tier: frontend } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html }
      volumes:
        - name: html
          configMap: { name: storefront-html }
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: demo
spec:
  selector: { app: storefront }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: demo
  labels: { app: catalog-api, app.kubernetes.io/part-of: shop-demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: catalog-api } }
  template:
    metadata: { labels: { app: catalog-api, tier: backend } }
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args: ['-listen=:8080', '-text={"products":42,"status":"ok"}']
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { cpu: 100m, memory: 48Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: demo
spec:
  selector: { app: catalog-api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: demo
  labels: { app: redis-cache, app.kubernetes.io/part-of: shop-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis-cache } }
  template:
    metadata: { labels: { app: redis-cache, tier: data } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: demo
spec:
  selector: { app: redis-cache }
  ports: [{ port: 6379, targetPort: 6379 }]
---
# Processes orders and writes structured logs (INFO / WARN / ERROR) for the log viewer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: demo
  labels: { app: order-worker, app.kubernetes.io/part-of: shop-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: order-worker } }
  template:
    metadata: { labels: { app: order-worker, tier: backend } }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ['/bin/sh', '-c']
          args:
            - |
              # Kubernetes expands $(...) in args, so values are computed into ${vars} first.
              # No timestamps here: the log viewer already shows the Kubernetes timestamp per line.
              i=1000
              while true; do
                i=$((i+1))
                items=$((i % 5 + 1))
                amount=$((i % 90 + 10))
                echo "INFO  order-worker: processed order #${i} (items=${items}, total=${amount}.99 USD)"
                if [ $((i % 7)) -eq 0 ]; then echo "WARN  order-worker: payment-service unreachable, retrying order #${i} in 5s"; fi
                if [ $((i % 23)) -eq 0 ]; then echo "ERROR order-worker: order #${i} failed after 3 retries: connection refused (payment-service:8443)"; fi
                sleep 3
              done
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
---
# Incident 1: crashes on startup because a required setting is missing -> CrashLoopBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: demo
  labels: { app: payment-service, app.kubernetes.io/part-of: shop-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-service } }
  template:
    metadata: { labels: { app: payment-service, tier: backend } }
    spec:
      containers:
        - name: payments
          image: busybox:1.36
          command: ['/bin/sh', '-c']
          args:
            - |
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) INFO  payment-service v2.4.1 starting"
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) INFO  loading configuration from environment"
              if [ -z "$PAYMENT_GATEWAY_URL" ]; then
                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ERROR required environment variable PAYMENT_GATEWAY_URL is not set"
                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) FATAL configuration invalid, shutting down (exit code 1)"
                exit 1
              fi
              while true; do sleep 3600; done
          env:
            - name: PAYMENT_TIMEOUT_MS
              value: "3000"
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
---
# Incident 2: memory grows until the container exceeds its limit -> OOMKilled, then restarts
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-sync
  namespace: demo
  labels: { app: inventory-sync, app.kubernetes.io/part-of: shop-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: inventory-sync } }
  template:
    metadata: { labels: { app: inventory-sync, tier: batch } }
    spec:
      containers:
        - name: sync
          image: busybox:1.36
          command: ['/bin/sh', '-c']
          args:
            - |
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) INFO  inventory-sync: loading full product catalog into memory"
              sleep 20
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) WARN  inventory-sync: catalog cache has no size limit"
              # Buffers /dev/zero in memory until the 48Mi limit is hit
              tail /dev/zero
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 48Mi }
---
# Steady CPU load so the utilization charts show real activity
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-generator
  namespace: demo
  labels: { app: report-generator, app.kubernetes.io/part-of: shop-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: report-generator } }
  template:
    metadata: { labels: { app: report-generator, tier: batch } }
    spec:
      containers:
        - name: reports
          image: busybox:1.36
          command: ['/bin/sh', '-c']
          args:
            - |
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) INFO  report-generator: building nightly sales report"
              while true; do
                # ~40s of work, then a short pause, so the CPU chart shows a realistic wave
                end=$(( $(date +%s) + 40 )); while [ $(date +%s) -lt $end ]; do :; done
                echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) INFO  report-generator: report batch complete"
                sleep 20
              done
          resources:
            requests: { cpu: 100m, memory: 8Mi }
            limits: { cpu: 750m, memory: 32Mi }
