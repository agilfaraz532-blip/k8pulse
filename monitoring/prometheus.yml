global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Live Kubernetes gauges exported by the K8sPulse backend (node usage, pod phases, restarts)
  - job_name: "k8spulse-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]

  # node-exporter runs with host networking; it is reached through the compose network gateway
  - job_name: "node-exporter"
    static_configs:
      - targets: ["172.29.0.1:9100"]
