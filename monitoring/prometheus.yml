global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "k8spulse-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "kubernetes-nodes"
    static_configs:
      - targets: ["host.docker.internal:9100"]
