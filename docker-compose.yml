services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: k8spulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: k8spulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - k8spulse-net

  # 2. Prometheus Metrics TSDB
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: k8spulse-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - k8spulse-net

  # 3. Host metrics (CPU, memory, network) for the Docker host / Kubernetes node.
  # Host networking exposes the real interfaces; Prometheus reaches it via the
  # k8spulse-net gateway (172.29.0.1), which is the Docker host.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: k8spulse-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--web.listen-address=:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  # 4. Grafana Visualizations (datasource + dashboard are provisioned automatically)
  grafana:
    image: grafana/grafana:11.0.0
    container_name: k8spulse-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/k8spulse-cluster.json
      - PROMETHEUS_URL=http://prometheus:9090
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - k8spulse-net

  # 5. FastAPI Observability Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: k8spulse-backend
    restart: unless-stopped
    # Secrets such as GEMINI_API_KEY / ADMIN_PASSWORD come from backend/.env (optional; never baked into the image)
    env_file:
      - path: ./backend/.env
        required: false
    # Values below override backend/.env with container-specific addresses
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/k8spulse_db
      - PROMETHEUS_URL=http://prometheus:9090
      - K8S_IN_CLUSTER=false
      # Host kubeconfig is mounted read-only; 127.0.0.1 API servers are reached via the host gateway
      - KUBECONFIG_PATH=/root/.kube/config
      - K8S_API_HOST_OVERRIDE=host.docker.internal
      # Ollama runs on the host machine, not inside the compose network
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
    volumes:
      - ${KUBECONFIG_HOST_PATH:-~/.kube/config}:/root/.kube/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - k8spulse-net

  # 6. React Dashboard UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: k8spulse-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - k8spulse-net

networks:
  k8spulse-net:
    driver: bridge
    # Fixed subnet so the gateway (the Docker host, where node-exporter listens) is predictable
    ipam:
      config:
        - subnet: 172.29.0.0/16
          gateway: 172.29.0.1

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
