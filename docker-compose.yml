version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: k8spulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: k8spulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - k8spulse-net

  # 2. Prometheus Metrics TSDB
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: k8spulse-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - k8spulse-net

  # 3. Grafana Visualizations
  grafana:
    image: grafana/grafana:11.0.0
    container_name: k8spulse-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - k8spulse-net

  # 4. FastAPI Observability Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: k8spulse-backend
    restart: unless-stopped
    # Secrets such as GEMINI_API_KEY come from backend/.env (optional; never baked into the image)
    env_file:
      - path: ./backend/.env
        required: false
    # Values below override backend/.env with container-specific addresses
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/k8spulse_db
      - PROMETHEUS_URL=http://prometheus:9090
      - K8S_IN_CLUSTER=false
      # Host kubeconfig is mounted read-only; 127.0.0.1 API servers are reached via the host gateway
      - KUBECONFIG_PATH=/root/.kube/config
      - K8S_API_HOST_OVERRIDE=host.docker.internal
      # Ollama runs on the host machine, not inside the compose network
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-super-secret-hex-key-in-production}
    volumes:
      - ${KUBECONFIG_HOST_PATH:-~/.kube/config}:/root/.kube/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - k8spulse-net

  # 5. React Dashboard UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: k8spulse-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - k8spulse-net

networks:
  k8spulse-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
