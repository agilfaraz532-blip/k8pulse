apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8spulse-postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8spulse-postgres
  labels:
    app: k8spulse-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: k8spulse-postgres
  template:
    metadata:
      labels:
        app: k8spulse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8spulse-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "k8spulse_db"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: k8spulse-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: k8spulse-postgres
spec:
  selector:
    app: k8spulse-postgres
  ports:
    - port: 5432
      targetPort: 5432
