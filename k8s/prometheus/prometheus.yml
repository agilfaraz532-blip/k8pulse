# Prometheus configuration for the in-cluster deployment (compose uses monitoring/prometheus.yml)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Live Kubernetes gauges exported by the K8sPulse backend
  - job_name: "k8spulse-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["k8spulse-backend:8000"]

  # node-exporter DaemonSet: one target per node, discovered through the headless service
  - job_name: "node-exporter"
    dns_sd_configs:
      - names: ["k8spulse-node-exporter"]
        type: A
        port: 9100
