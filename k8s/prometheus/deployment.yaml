apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8spulse-prometheus
  labels:
    app: k8spulse-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8spulse-prometheus
  template:
    metadata:
      labels:
        app: k8spulse-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: k8spulse-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: k8spulse-prometheus
spec:
  selector:
    app: k8spulse-prometheus
  ports:
    - port: 9090
      targetPort: 9090
