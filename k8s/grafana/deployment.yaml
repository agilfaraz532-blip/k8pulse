apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8spulse-grafana
  labels:
    app: k8spulse-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8spulse-grafana
  template:
    metadata:
      labels:
        app: k8spulse-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8spulse-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/k8spulse-cluster.json
            - name: PROMETHEUS_URL
              value: "http://k8spulse-prometheus:9090"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
      volumes:
        - name: datasources
          configMap:
            name: k8spulse-grafana-datasources
        - name: dashboard-providers
          configMap:
            name: k8spulse-grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: k8spulse-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: k8spulse-grafana
spec:
  type: NodePort
  selector:
    app: k8spulse-grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
