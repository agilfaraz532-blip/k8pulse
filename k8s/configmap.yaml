apiVersion: v1
kind: ConfigMap
metadata:
  name: k8spulse-config
  namespace: k8spulse
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  K8S_IN_CLUSTER: "true"
  PROMETHEUS_URL: "http://k8spulse-prometheus:9090"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@k8spulse-postgres:5432/k8spulse_db"
