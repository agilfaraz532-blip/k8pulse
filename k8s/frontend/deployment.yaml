apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8spulse-frontend
  namespace: k8spulse
  labels:
    app: k8spulse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8spulse-frontend
  template:
    metadata:
      labels:
        app: k8spulse-frontend
    spec:
      containers:
        - name: frontend
          image: k8spulse/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: k8spulse-frontend
  namespace: k8spulse
spec:
  type: NodePort
  selector:
    app: k8spulse-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
