apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8spulse-frontend
  labels:
    app: k8spulse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8spulse-frontend
  template:
    metadata:
      labels:
        app: k8spulse-frontend
    spec:
      containers:
        - name: frontend
          image: k8pulse-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            # Rendered into the nginx config at startup (see frontend/templates/default.conf.template)
            - name: BACKEND_UPSTREAM
              value: "k8spulse-backend:8000"
            - name: DNS_RESOLVER
              value: "kube-dns.kube-system.svc.cluster.local"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: k8spulse-frontend
spec:
  type: NodePort
  selector:
    app: k8spulse-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
