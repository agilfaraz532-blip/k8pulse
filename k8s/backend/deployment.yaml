apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8spulse-backend
  namespace: k8spulse
  labels:
    app: k8spulse-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8spulse-backend
  template:
    metadata:
      labels:
        app: k8spulse-backend
    spec:
      serviceAccountName: k8spulse-viewer-sa
      containers:
        - name: backend
          image: k8spulse/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: k8spulse-config
            - secretRef:
                name: k8spulse-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: k8spulse-backend
  namespace: k8spulse
spec:
  selector:
    app: k8spulse-backend
  ports:
    - port: 8000
      targetPort: 8000
