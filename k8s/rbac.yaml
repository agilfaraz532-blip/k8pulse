apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8spulse-viewer-sa
  namespace: k8spulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8spulse-viewer-role
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - namespaces
      - events
      - configmaps
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8spulse-viewer-binding
subjects:
  - kind: ServiceAccount
    name: k8spulse-viewer-sa
    namespace: k8spulse
roleRef:
  kind: ClusterRole
  name: k8spulse-viewer-role
  apiGroup: rbac.authorization.k8s.io
